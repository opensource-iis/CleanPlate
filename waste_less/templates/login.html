{% extends 'base.html' %}

{% block content %}
<section class="auth-card">
  <h1>Welcome back</h1>
  <form method="POST">
    <label>
      Email
      <input type="email" name="email" required />
    </label>
    <label>
      Password
      <input type="password" name="password" required />
    </label>
    <button type="submit" class="button primary">Login</button>
  </form>
  <p class="auth-meta">Need an account? <a href="{{ url_for('main.register') }}">Create one</a></p>
</section>
{% endblock %}
