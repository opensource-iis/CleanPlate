{% extends 'base.html' %}

{% block content %}
<section class="page-header">
  <h1>Leaderboard</h1>
  <p>See the biggest food-savers in your community this week.</p>
</section>

<section class="panel">
  <table class="leaderboard-table">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Role</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>#{{ loop.index }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.role|title }}</td>
        <td>{{ user.points }} pts</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
